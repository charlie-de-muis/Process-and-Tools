# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  # Test Job
  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: [3.8, 3.9]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./CargoHub
      - name: Test with pytest
        run: |
          pytest
        working-directory: ./CargoHub

  # Check SSH Key Availability
  check_ssh:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Debug SSH Key Secret
        run: |
          echo "Checking if the SERVER_SSH_KEY secret is available"
          echo "Secret is set"
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

  # Deploy Job
  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: 145.24.223.64  # Your server's IP address
          username: ubuntu-1021342  # Your SSH username
          key: ${{ secrets.SERVER_SSH_KEY }}  # The private key from GitHub secrets
          port: 22  # Default SSH port
          script: |
            cd /home/ubuntu-1021342/Repo/Process-and-Tools/CargoHub
            git pull origin Refactoring
            source /home/ubuntu-1021342/Repo/Process-and-Tools/CargoHub/venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            sudo systemctl restart django
          timeout: 300s  # Timeout in seconds (5 minutes)
